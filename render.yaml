# Option A: ONE URL (frontend + API in one service) — recommended for simplicity
services:
  - type: web
    name: business-os
    runtime: docker
    dockerfilePath: ./Dockerfile.combined
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

