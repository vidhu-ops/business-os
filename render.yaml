services:
  - type: web
    name: business-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Free tier sleeps after ~15 min idle — first request after sleep can take 30–90s.
    healthCheckPath: /api/v1/health
    envVars:
      - key: API_URL
        value: http://127.0.0.1:8000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # FRONTEND_URL and CORS_ORIGINS auto-set from RENDER_EXTERNAL_URL in render-combined-start.sh
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ZO_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PARTNER_ADMIN_KEY
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: FREECHARGE_MODE
        value: sandbox
      - key: FREECHARGE_MERCHANT_ID
        sync: false
      - key: FREECHARGE_SECRET_KEY
        sync: false
      - key: FREECHARGE_AES_KEY
        sync: false
      - key: FREECHARGE_AES_IV
        sync: false
