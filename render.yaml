services:
  - type: web
    name: business-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Free tier sleeps after ~15 min idle — first request after sleep can take 30–90s.
    # For durable signup/projects: upgrade + attach a disk at /var/data (or set DATABASE_URL).
    healthCheckPath: /api/health
    envVars:
      - key: API_URL
        value: http://127.0.0.1:8000
      - key: NODE_ENV
        value: production
      # Set these after attaching a Render disk at /var/data (Starter+), or leave unset.
      - key: DATA_DIR
        sync: false
      - key: BUSINESS_OUTPUTS_ROOT
        sync: false
      - key: OPPORTUNITY_WORKSPACE_ROOT
        sync: false
      - key: USER_DB_PATH
        sync: false
      - key: WORKSPACE_DB_PATH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Free durable option: Neon Postgres connection string
      - key: DATABASE_URL
        sync: false
      # Custom domain — used for OAuth redirects (Canva must match exactly).
      - key: PUBLIC_APP_URL
        value: https://iidatech.biz
      - key: OAUTH_REDIRECT_URI
        value: https://iidatech.biz/api/v1/oauth/callback
      - key: CANVA_REDIRECT_URI
        value: https://iidatech.biz/api/v1/oauth/callback
      # FRONTEND_URL and CORS_ORIGINS default from PUBLIC_APP_URL or RENDER_EXTERNAL_URL in render-combined-start.sh
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ZO_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PARTNER_ADMIN_KEY
        sync: false
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: FREECHARGE_MODE
        value: sandbox
      - key: FREECHARGE_MERCHANT_ID
        sync: false
      - key: FREECHARGE_SECRET_KEY
        sync: false
      - key: FREECHARGE_AES_KEY
        sync: false
      - key: FREECHARGE_AES_IV
        sync: false
