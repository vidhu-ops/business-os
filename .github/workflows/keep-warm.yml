# Keep the Render Free instance from spinning down (~15 min idle → cold start).
#
# Fixed: status-code capture no longer mixes log lines into the HTTP code check.
# Optional repo variable: KEEP_WARM_URL (default https://iidatech.biz)
#
# Note: GitHub scheduled Actions can still drift/skip. For stricter uptime, also
# use UptimeRobot / cron-job.org every 5 minutes, or upgrade Render off Free.

name: Keep warm

on:
  schedule:
    # Every 10 minutes — under Render's ~15 min idle sleep window.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoints
        env:
          KEEP_WARM_URL: ${{ vars.KEEP_WARM_URL }}
        run: |
          set -euo pipefail
          BASE="${KEEP_WARM_URL:-https://iidatech.biz}"
          BASE="${BASE%/}"
          TS="$(date +%s)"
          echo "Pinging ${BASE} (cache-bust t=${TS})"

          http_code() {
            local path="$1"
            local url="${BASE}${path}?warm=1&t=${TS}"
            local code
            code="$(curl -sS -o /tmp/keep-warm.body -w "%{http_code}" \
              -H "Cache-Control: no-cache" \
              -H "Pragma: no-cache" \
              --connect-timeout 20 --max-time 100 \
              -L "${url}" || echo "000")"
            echo "GET ${path} -> HTTP ${code}" >&2
            printf '%s' "${code}"
          }

          try_warm() {
            local code
            code="$(http_code /api/health)"
            if [ "${code}" = "200" ]; then
              return 0
            fi
            code="$(http_code /api/v1/health)"
            if [ "${code}" = "200" ]; then
              return 0
            fi
            echo "Last body:" >&2
            head -c 800 /tmp/keep-warm.body >&2 || true
            echo >&2
            return 1
          }

          # Cold starts on Free can take ~60s; retry a couple times.
          ok=0
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3..."
            if try_warm; then
              ok=1
              break
            fi
            sleep 15
          done

          if [ "${ok}" != "1" ]; then
            echo "Keep-warm ping failed after retries"
            exit 1
          fi
          echo "OK - service is warm"
